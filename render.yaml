# One-click setup on Render (Dashboard -> New -> Blueprint). See DEPLOY.md.
services:
  - type: web
    name: focusguard-ai
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL          # Postgres connection string (e.g. from Neon)
        sync: false
      - key: GEMINI_API_KEY        # optional: AI insights (free key at aistudio.google.com)
        sync: false
      - key: ANTHROPIC_API_KEY     # optional
        sync: false
      - key: CHEAPER_INFERENCE_API_KEY  # optional
        sync: false
      - key: GOOGLE_CLIENT_ID      # optional: Sign in with Google + Gmail API (see DEPLOY.md 2b)
        sync: false
      - key: GOOGLE_CLIENT_SECRET  # optional: Gmail API
        sync: false
      - key: GMAIL_ADDRESS         # optional: sends "Forgot password?" emails
        sync: false
      - key: GMAIL_REFRESH_TOKEN   # optional: Gmail API
        sync: false
